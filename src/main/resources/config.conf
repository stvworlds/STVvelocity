# STVvelocity Configuration

init-message = "STVvelocity has been initialized!"

# Backend servers that participate in global chat (Velocity server names).
# Messages received on stvchat:main from one of these servers are forwarded
# as-is to every other server in this list (source is excluded).
global-messaging {
    servers = ["beta", "farm"]
}

whitelist-protected {
    servers = ["beta"]
}

api-key = "KEY123"